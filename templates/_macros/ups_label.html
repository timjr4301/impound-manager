{% macro ups_label_section(letter) %}
{% if letter.label_image_data %}
<div class="mt-2">
  <button type="button" class="btn btn-sm btn-outline-secondary" onclick='printUpsLabel({{ letter.label_image_data|tojson }})'>
    <i class="bi bi-printer"></i> View/Print UPS Label
  </button>
</div>
{% endif %}
{% if letter.label_image_data_2 %}
<div class="mt-2">
  <button type="button" class="btn btn-sm btn-outline-secondary" onclick='printUpsLabel({{ letter.label_image_data_2|tojson }})'>
    <i class="bi bi-printer"></i> View/Print 2nd Party UPS Label
  </button>
</div>
{% endif %}
{% endmacro %}

{% macro ups_label_script() %}
<script>
function printUpsLabel(b64) {
  if (!b64) return;
  const win = window.open('', '_blank');
  win.document.write(`<html><body style="margin:0"><img src="data:image/gif;base64,${b64}" style="max-width:100%"></body></html>`);
  win.document.close();
  win.print();
}
</script>
{% endmacro %}
